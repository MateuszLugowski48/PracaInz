<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Head-to-Head Extended Analysis</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        select, button { padding: 8px; margin: 5px; }
        .chart-container { width: 400px; height: 300px; margin: 20px auto; }
        #statsSection { margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Head-to-Head Extended Analysis</h1>

    <a href="/">Wróć do strony głównej</a>

    <div>
        <label>Wybierz ligę: </label>
        <select id="leagueSelect">
            <option value="">-- Wybierz ligę --</option>
        </select>

        <label>Drużyna A: </label>
        <select id="teamASelect">
            <option value="">-- Wybierz drużynę --</option>
        </select>

        <label>Drużyna B: </label>
        <select id="teamBSelect">
            <option value="">-- Wybierz drużynę --</option>
        </select>

        <button id="compareBtn">Porównaj</button>
    </div>

    <div id="statsSection" style="display: none;">
        <h2>Statystyki</h2>
        <p id="statsText"></p>

        <h3>Wygrane / Remisy / Przegrane</h3>
        <div class="chart-container">
            <canvas id="resultsChart"></canvas>
        </div>

        <h3>Średnia bramek na mecz</h3>
        <div class="chart-container">
            <canvas id="goalsChart"></canvas>
        </div>
    </div>

    <h2>Historia meczów</h2>
    <table id="h2hTable">
        <thead>
            <tr>
                <th>Data</th>
                <th>Drużyna A</th>
                <th>Drużyna B</th>
                <th>Wynik</th>
                <th>Rodzaj rozgrywek</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
    (function() {
        let resultsChart = null;
        let goalsChart = null;

        async function loadLeagues() {
            try {
                const res = await fetch('/leagues');
                if (!res.ok) throw new Error('Błąd pobierania lig: ' + res.status);
                const leagues = await res.json();
                const leagueSelect = document.getElementById("leagueSelect");
                leagueSelect.innerHTML = "";
                leagueSelect.appendChild(new Option("-- Wybierz ligę --", ""));
                leagues.forEach(league => {
                    leagueSelect.appendChild(new Option(league.name, league.id));
                });
                leagueSelect.addEventListener("change", loadTeams);
            } catch (err) {
                console.error(err);
                alert("Nie udało się pobrać listy lig. Sprawdź konsolę.");
            }
        }

        async function loadTeams() {
            const leagueId = document.getElementById("leagueSelect").value;
            const teamASelect = document.getElementById("teamASelect");
            const teamBSelect = document.getElementById("teamBSelect");
            teamASelect.innerHTML = "<option value=''>-- Wybierz drużynę --</option>";
            teamBSelect.innerHTML = "<option value=''>-- Wybierz drużynę --</option>";

            if (!leagueId) return;

            try {
                const res = await fetch(`/teams/${leagueId}`);
                if (!res.ok) throw new Error('Błąd pobierania drużyn: ' + res.status);
                const teams = await res.json();
                teams.forEach(t => {
                    teamASelect.appendChild(new Option(t.name, t.id));
                    teamBSelect.appendChild(new Option(t.name, t.id));
                });
            } catch (err) {
                console.error(err);
                alert("Nie udało się pobrać drużyn. Sprawdź konsolę.");
            }
        }

        async function compareTeams() {
            const teamA = document.getElementById("teamASelect").value;
            const teamB = document.getElementById("teamBSelect").value;
            if (!teamA || !teamB) { alert("Wybierz obie drużyny."); return; }

            try {
                // statystyki
                const statsRes = await fetch(`/head-to-head-stats/${teamA}/${teamB}`);
                if (!statsRes.ok) throw new Error('Błąd pobierania statystyk: ' + statsRes.status);
                const stats = await statsRes.json();

                document.getElementById("statsSection").style.display = "block";
                document.getElementById("statsText").textContent =
                    `Mecze: ${stats.total_matches}, Wygrane A: ${stats.team1_wins}, Wygrane B: ${stats.team2_wins}, Remisy: ${stats.draws}, Średnia bramek A: ${stats.team1_avg_goals}, B: ${stats.team2_avg_goals}`;

                // results chart
                if (resultsChart) resultsChart.destroy();
                const resultsCtx = document.getElementById('resultsChart').getContext('2d');
                resultsChart = new Chart(resultsCtx, {
                    type: 'bar',
                    data: {
                        labels: ['Drużyna A', 'Drużyna B', 'Remisy'],
                        datasets: [{
                            label: 'Liczba meczów',
                            data: [stats.team1_wins, stats.team2_wins, stats.draws],
                            backgroundColor: ['rgba(75,192,192,0.2)','rgba(255,99,132,0.2)','rgba(255,205,86,0.2)'],
                            borderColor: ['rgba(75,192,192,1)','rgba(255,99,132,1)','rgba(255,205,86,1)'],
                            borderWidth: 1
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });

                // goals chart
                if (goalsChart) goalsChart.destroy();
                const goalsCtx = document.getElementById('goalsChart').getContext('2d');
                goalsChart = new Chart(goalsCtx, {
                    type: 'line',
                    data: {
                        labels: ['Drużyna A', 'Drużyna B'],
                        datasets: [{
                            label: 'Średnia bramek',
                            data: [stats.team1_avg_goals, stats.team2_avg_goals],
                            borderColor: 'rgba(54,162,235,1)',
                            tension: 0.1,
                            fill: false
                        }]
                    },
                    options: { responsive: true, maintainAspectRatio: false }
                });

                // history
                const res = await fetch(`/head-to-head/${teamA}/${teamB}`);
                if (!res.ok) throw new Error('Błąd pobierania historii: ' + res.status);
                const data = await res.json();
                const tbody = document.querySelector("#h2hTable tbody");
                tbody.innerHTML = "";

                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5">Brak wspólnych meczów.</td></tr>`;
                    return;
                }

                data.forEach(match => {
                    const row = document.createElement("tr");
                    let homeCell = match.home;
                    let awayCell = match.away;
                    if (match.winner === "home") homeCell = `<strong>${match.home}</strong>`;
                    else if (match.winner === "away") awayCell = `<strong>${match.away}</strong>`;

                    row.innerHTML = `
                        <td>${match.date}</td>
                        <td>${homeCell}</td>
                        <td>${awayCell}</td>
                        <td>${match.score}</td>
                        <td>${match.league_name || ''}</td>
                    `;
                    tbody.appendChild(row);
                });

            } catch (err) {
                console.error(err);
                alert("Wystąpił błąd podczas porównania drużyn. Sprawdź konsolę (F12).");
            }
        }

        document.getElementById('compareBtn').addEventListener('click', compareTeams);

        // inicjalizacja
        loadLeagues();
    })();
    </script>
</body>
</html>
