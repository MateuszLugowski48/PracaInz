<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Porównanie Piłkarzy H2H</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.5s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 pb-12">

    {% include 'navbar.html' %}

    <div class="max-w-6xl mx-auto px-4 mt-8">
        
        <h1 class="text-3xl font-extrabold text-center text-gray-900 mb-2">⚔️ Pojedynek Gwiazd (H2H)</h1>
        <p class="text-center text-gray-500 mb-8 text-sm">Porównanie łączne ze wszystkich rozgrywek w sezonie</p>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-blue-200 relative">
                <h3 class="text-xs font-bold text-blue-600 uppercase mb-2">Zawodnik 1</h3>
                <input type="text" id="search1" onkeyup="searchPlayer(1)" placeholder="Szukaj gracza..." class="w-full border-b-2 border-gray-100 py-2 focus:outline-none focus:border-blue-500 font-bold mb-4 text-lg transition">
                <div id="results1" class="absolute left-0 right-0 bg-white shadow-xl z-20 rounded-xl hidden max-h-60 overflow-y-auto border border-gray-100 mx-6"></div>
                
                <div id="p1-card" class="hidden text-center animate-fade-in mt-4">
                    <div class="relative w-24 h-24 mx-auto mb-3">
                        <img id="p1-img" class="w-full h-full rounded-full object-cover border-4 border-blue-100 shadow-md">
                        <div class="absolute bottom-0 right-0 bg-blue-600 text-white text-xs font-bold px-2 py-0.5 rounded-full shadow">P1</div>
                    </div>
                    <h2 id="p1-name" class="text-xl font-black text-gray-900 leading-tight"></h2>
                    <p id="p1-team" class="text-sm text-gray-500 mt-1"></p>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl shadow-sm border border-red-200 relative">
                <h3 class="text-xs font-bold text-red-600 uppercase mb-2">Zawodnik 2</h3>
                <input type="text" id="search2" onkeyup="searchPlayer(2)" placeholder="Szukaj gracza..." class="w-full border-b-2 border-gray-100 py-2 focus:outline-none focus:border-red-500 font-bold mb-4 text-lg transition">
                <div id="results2" class="absolute left-0 right-0 bg-white shadow-xl z-20 rounded-xl hidden max-h-60 overflow-y-auto border border-gray-100 mx-6"></div>
                
                <div id="p2-card" class="hidden text-center animate-fade-in mt-4">
                    <div class="relative w-24 h-24 mx-auto mb-3">
                        <img id="p2-img" class="w-full h-full rounded-full object-cover border-4 border-red-100 shadow-md">
                        <div class="absolute bottom-0 right-0 bg-red-600 text-white text-xs font-bold px-2 py-0.5 rounded-full shadow">P2</div>
                    </div>
                    <h2 id="p2-name" class="text-xl font-black text-gray-900 leading-tight"></h2>
                    <p id="p2-team" class="text-sm text-gray-500 mt-1"></p>
                </div>
            </div>
        </div>

        <div class="flex flex-col items-center justify-center mb-12 space-y-4">
            <div class="w-64">
                <label class="block text-xs font-bold text-gray-400 uppercase text-center mb-2">Wybierz Sezon</label>
                <select id="seasonSelect" onchange="handleSeasonChange()" class="block w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5 text-center shadow-sm font-medium">
                </select>
            </div>

            <button id="compareBtn" onclick="compare()" disabled class="bg-gray-300 text-white font-bold py-3 px-12 rounded-full shadow-lg transition transform scale-95 cursor-not-allowed">
                GENERUJ PORÓWNANIE (ALL) 📊
            </button>
        </div>

        <div id="comparisonResult" class="hidden grid grid-cols-1 lg:grid-cols-3 gap-8 animate-fade-in">
            
            <div class="lg:col-span-1 bg-white rounded-3xl shadow-sm border border-gray-200 p-6 flex flex-col items-center">
                <h4 class="text-gray-900 font-bold mb-2">Profil Umiejętności</h4>
                <p class="text-xs text-gray-400 mb-4 text-center">Dane zsumowane (Liga + Puchary)</p>
                <div class="relative w-full h-72 md:h-80">
                    <canvas id="radarChart"></canvas>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white rounded-3xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                    <h4 class="font-bold text-gray-900">Łączne Statystyki</h4>
                    <span class="text-xs text-blue-600 bg-blue-50 px-2 py-1 rounded border border-blue-100">Wszystkie rozgrywki</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-sm text-left">
                        <thead class="bg-gray-50 text-gray-500">
                            <tr>
                                <th class="py-3 px-6 text-left font-medium w-1/3">Statystyka</th>
                                <th class="py-3 px-6 text-center text-blue-600 font-bold w-1/3" id="th-p1">P1</th>
                                <th class="py-3 px-6 text-center text-red-600 font-bold w-1/3" id="th-p2">P2</th>
                            </tr>
                        </thead>
                        <tbody id="stats-table-body" class="divide-y divide-gray-100">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <script>
        let p1 = null, p2 = null;
        let chartInstance = null;
        let timeouts = {};

        function initSeasons() {
            const select = document.getElementById("seasonSelect");
            const currentYear = new Date().getFullYear();
            const minYear = 2018; 
            
            for(let y = currentYear; y >= minYear; y--) {
                const opt = document.createElement("option");
                opt.value = y;
                opt.text = `Sezon ${y}/${y+1}`;
                select.appendChild(opt);
            }
            // Domyślnie poprzedni rok jeśli mamy początek roku
            if(new Date().getMonth() < 6) select.value = currentYear - 1;
        }

        function handleSeasonChange() {
            if (!document.getElementById("comparisonResult").classList.contains("hidden") && p1 && p2) {
                compare();
            }
        }

        function searchPlayer(num) {
            clearTimeout(timeouts[num]);
            const q = document.getElementById(`search${num}`).value;
            const resDiv = document.getElementById(`results${num}`);
            
            if(q.length < 3) { resDiv.classList.add('hidden'); return; }

            timeouts[num] = setTimeout(async () => {
                try {
                    const res = await fetch(`/search-players?q=${q}`);
                    const data = await res.json();
                    resDiv.innerHTML = "";
                    
                    if(data.length > 0) {
                        resDiv.classList.remove('hidden');
                        data.forEach(p => {
                            const d = document.createElement('div');
                            d.className = "flex items-center p-3 hover:bg-gray-50 cursor-pointer border-b border-gray-50 transition";
                            d.onclick = () => selectPlayer(num, p);
                            d.innerHTML = `<img src="${p.photo}" class="w-8 h-8 rounded-full mr-3 object-cover shadow-sm"><div class="text-sm font-bold text-gray-800">${p.name}<br><span class="text-xs text-gray-400 font-normal">${p.team}</span></div>`;
                            resDiv.appendChild(d);
                        });
                    } else {
                        resDiv.innerHTML = "<div class='p-3 text-sm text-gray-400'>Brak wyników.</div>";
                        resDiv.classList.remove('hidden');
                    }
                } catch(e) { console.error(e); }
            }, 300);
        }

        function selectPlayer(num, player) {
            if(num === 1) p1 = player; else p2 = player;
            
            document.getElementById(`results${num}`).classList.add("hidden");
            document.getElementById(`search${num}`).value = "";
            
            const card = document.getElementById(`p${num}-card`);
            card.classList.remove("hidden");
            
            document.getElementById(`p${num}-name`).textContent = player.name;
            document.getElementById(`p${num}-team`).textContent = player.team;
            document.getElementById(`p${num}-img`).src = player.photo;

            if(p1 && p2) {
                const btn = document.getElementById("compareBtn");
                btn.disabled = false;
                btn.classList.remove("bg-gray-300", "cursor-not-allowed", "scale-95");
                btn.classList.add("bg-gradient-to-r", "from-blue-600", "to-red-600", "cursor-pointer", "transform", "hover:scale-105", "shadow-xl");
            }
        }

        // --- KLUCZOWA ZMIANA: AGREGACJA STATYSTYK ZE WSZYSTKICH LIG ---
        function aggregateStats(statsArray) {
            // Pusty obiekt startowy
            let total = {
                games: { appearences: 0, minutes: 0, rating: 0 },
                goals: { total: 0, assists: 0 },
                shots: { on: 0 },
                passes: { key: 0, accuracy: 0 },
                dribbles: { success: 0 },
                duels: { won: 0 },
                tackles: { interceptions: 0 },
                cards: { yellow: 0, red: 0 }
            };

            if (!statsArray || statsArray.length === 0) return total;

            let ratingSum = 0;
            let ratingCount = 0;
            let accuracySum = 0;
            let accuracyCount = 0;

            statsArray.forEach(s => {
                // Funkcja pomocnicza do bezpiecznego pobierania wartości
                const get = (path) => path.split('.').reduce((acc, c) => (acc && acc[c] != null) ? acc[c] : 0, s);

                // Sumowanie prostych liczb
                total.games.appearences += parseInt(get('games.appearences')) || 0;
                total.games.minutes += parseInt(get('games.minutes')) || 0;
                total.goals.total += parseInt(get('goals.total')) || 0;
                total.goals.assists += parseInt(get('goals.assists')) || 0;
                total.shots.on += parseInt(get('shots.on')) || 0;
                total.passes.key += parseInt(get('passes.key')) || 0;
                total.dribbles.success += parseInt(get('dribbles.success')) || 0;
                total.duels.won += parseInt(get('duels.won')) || 0;
                total.tackles.interceptions += parseInt(get('tackles.interceptions')) || 0;
                total.cards.yellow += parseInt(get('cards.yellow')) || 0;
                total.cards.red += parseInt(get('cards.red')) || 0;

                // Ważona średnia oceny (rating)
                let rating = parseFloat(get('games.rating')) || 0;
                let matches = parseInt(get('games.appearences')) || 0;
                if (rating > 0 && matches > 0) {
                    ratingSum += rating * matches;
                    ratingCount += matches;
                }

                // Ważona średnia celności podań
                let acc = parseInt(get('passes.accuracy')) || 0;
                if (acc > 0 && matches > 0) {
                     accuracySum += acc * matches;
                     accuracyCount += matches;
                }
            });

            // Wyliczanie ostatecznych średnich
            total.games.rating = ratingCount > 0 ? (ratingSum / ratingCount).toFixed(2) : "0.00";
            total.passes.accuracy = accuracyCount > 0 ? Math.round(accuracySum / accuracyCount) : 0;

            return total;
        }

        // Pomocnicza funkcja do wyciągania z zagregowanego obiektu
        function getStatValue(obj, path) {
            return path.split('.').reduce((acc, c) => (acc && acc[c] != null) ? acc[c] : 0, obj);
        }

        async function compare() {
            if(!p1 || !p2) return;
            
            const season = document.getElementById("seasonSelect").value;
            const btn = document.getElementById("compareBtn");
            const originalText = btn.textContent;
            
            btn.textContent = "POBIERANIE...";
            btn.disabled = true;
            btn.classList.add("opacity-75");
            
            try {
                const [d1, d2] = await Promise.all([
                    fetch(`/api/player-data/${p1.id}?season=${season}`).then(r => r.json()),
                    fetch(`/api/player-data/${p2.id}?season=${season}`).then(r => r.json())
                ]);

                // TERAZ UŻYWAMY FUNKCJI AGREGUJĄCEJ ZAMIAST statistics[0]
                const s1 = aggregateStats(d1.statistics);
                const s2 = aggregateStats(d2.statistics);

                // --- TABELA ---
                const metrics = [
                    { label: "Mecze Rozegrane", path: "games.appearences" },
                    { label: "Minuty", path: "games.minutes" },
                    { label: "Gole", path: "goals.total" },
                    { label: "Asysty", path: "goals.assists" },
                    { label: "Strzały Celne", path: "shots.on" },
                    { label: "Kluczowe Podania", path: "passes.key" },
                    { label: "Celność Podań %", path: "passes.accuracy", unit: "%" },
                    { label: "Dryblingi Udane", path: "dribbles.success" },
                    { label: "Pojedynki Wygrane", path: "duels.won" },
                    { label: "Przechwyty", path: "tackles.interceptions" },
                    { label: "Kartki (Żółte/Cz.)", path: "cards.yellow", special: true },
                    { label: "Średnia Ocena", path: "games.rating", isRating: true }
                ];

                const tbody = document.getElementById("stats-table-body");
                tbody.innerHTML = "";
                document.getElementById("th-p1").textContent = p1.name;
                document.getElementById("th-p2").textContent = p2.name;

                metrics.forEach(m => {
                    let v1 = getStatValue(s1, m.path);
                    let v2 = getStatValue(s2, m.path);

                    // Obsługa kartek (łączenie żółtych i czerwonych do wyświetlenia)
                    if(m.special && m.path === "cards.yellow") {
                        v1 = `${v1} / ${s1.cards.red}`;
                        v2 = `${v2} / ${s2.cards.red}`;
                    }

                    // Kolorowanie
                    let c1 = "text-gray-800", c2 = "text-gray-800";
                    let bg1 = "", bg2 = "";
                    let val1 = parseFloat(v1);
                    let val2 = parseFloat(v2);

                    if (!m.special && val1 > val2) { 
                        c1 = "text-green-600 font-extrabold"; 
                        bg1 = "bg-green-50 rounded-lg";
                    } else if (!m.special && val2 > val1) { 
                        c2 = "text-green-600 font-extrabold"; 
                        bg2 = "bg-green-50 rounded-lg";
                    }

                    const row = `
                        <tr class="hover:bg-gray-50 transition">
                            <td class="py-3 px-6 text-gray-500 font-medium">${m.label}</td>
                            <td class="py-3 px-6 text-center ${c1}"><span class="px-2 py-1 ${bg1}">${v1}${m.unit || ''}</span></td>
                            <td class="py-3 px-6 text-center ${c2}"><span class="px-2 py-1 ${bg2}">${v2}${m.unit || ''}</span></td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });

                // --- WYKRES RADAROWY ---
                const radarLabels = ["Gole", "Asysty", "Strzały Celne", "Kluczowe Podania", "Dryblingi", "Ocena (x2)"];
                
                const data1 = [
                    s1.goals.total, s1.goals.assists, s1.shots.on, s1.passes.key, s1.dribbles.success,
                    (parseFloat(s1.games.rating) || 0) * 2
                ];

                const data2 = [
                    s2.goals.total, s2.goals.assists, s2.shots.on, s2.passes.key, s2.dribbles.success,
                    (parseFloat(s2.games.rating) || 0) * 2
                ];

                renderRadarChart(p1.name, p2.name, radarLabels, data1, data2);

                document.getElementById("comparisonResult").classList.remove("hidden");
                setTimeout(() => {
                    document.getElementById("comparisonResult").scrollIntoView({behavior: 'smooth', block: 'start'});
                }, 100);

            } catch (e) {
                console.error(e);
                alert("Wystąpił błąd danych.");
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
                btn.classList.remove("opacity-75");
            }
        }

        function renderRadarChart(name1, name2, labels, d1, d2) {
            const ctx = document.getElementById('radarChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: name1,
                            data: d1,
                            backgroundColor: 'rgba(37, 99, 235, 0.2)', 
                            borderColor: '#2563eb', 
                            pointBackgroundColor: '#2563eb',
                            borderWidth: 2
                        },
                        {
                            label: name2,
                            data: d2,
                            backgroundColor: 'rgba(220, 38, 38, 0.2)', 
                            borderColor: '#dc2626', 
                            pointBackgroundColor: '#dc2626',
                            borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        r: {
                            beginAtZero: true,
                            grid: { color: '#e5e7eb' }, 
                            pointLabels: {
                                font: { size: 11, weight: 'bold', family: 'Inter' },
                                color: '#4b5563'
                            },
                            ticks: { display: false }
                        }
                    },
                    plugins: {
                        legend: { position: 'bottom' }
                    }
                }
            });
        }

        initSeasons();
    </script>
</body>
</html>
