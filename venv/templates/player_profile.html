<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Profil Zawodnika</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
    
</head>
<body class="bg-gray-100 text-gray-800 pb-12">

    {% include 'navbar.html' %}

    <div id="loading" class="text-center py-20">
        <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-blue-500 border-t-transparent"></div>
    </div>

    <div id="content" class="max-w-4xl mx-auto px-4 mt-6 hidden animate-fade-in">
        
        <div class="bg-white rounded-3xl shadow-sm border border-gray-200 p-6 mb-6 flex flex-col md:flex-row items-center">
            <img id="pPhoto" class="w-32 h-32 rounded-full object-cover border-4 border-gray-50 shadow-sm mb-4 md:mb-0 md:mr-8">
            <div class="text-center md:text-left flex-1">
                <h1 class="text-3xl font-extrabold text-gray-900 mb-1 flex items-center justify-center md:justify-start">
                    <span id="pName"></span>
                    <span id="pNumber" class="ml-3 bg-blue-100 text-blue-700 text-sm font-bold px-2 py-1 rounded-lg hidden"></span>
                </h1>
                <p id="pTeam" class="text-gray-500 font-medium mb-4 text-lg"></p>
                
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-sm bg-gray-50 p-4 rounded-xl border border-gray-100">
                    <div>
                        <div class="text-gray-400 text-xs uppercase font-bold">Wiek</div>
                        <div id="pAge" class="font-bold text-gray-800"></div>
                    </div>
                    <div>
                        <div class="text-gray-400 text-xs uppercase font-bold">Narodowość</div>
                        <div id="pNation" class="font-bold text-gray-800"></div>
                    </div>
                    <div>
                        <div class="text-gray-400 text-xs uppercase font-bold">Wzrost</div>
                        <div id="pHeight" class="font-bold text-gray-800"></div>
                    </div>
                    <div>
                        <div class="text-gray-400 text-xs uppercase font-bold">Pozycja</div>
                        <div id="pPos" class="font-bold text-gray-800"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex items-center justify-between mb-4 ml-1">
            <h3 class="font-bold text-gray-800 text-lg">Statystyki</h3>
            <select id="seasonSelect" onchange="loadPlayer()" class="bg-white border border-gray-300 text-gray-700 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block p-2.5 shadow-sm">
                </select>
        </div>

        <div id="statsContainer" class="space-y-4 mb-8"></div>

        <h3 class="font-bold text-gray-800 text-lg mb-3 ml-1">Historia Transferów</h3>
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
            <div id="transfersList" class="divide-y divide-gray-100"></div>
        </div>

    </div>

    <script>
        const playerId = Number("{{ player_id }}");

        function initSeasons() {
            const select = document.getElementById("seasonSelect");
            const currentYear = 2025; // API Sports sezon 25/26 to 2025
            const minYear = 2020;
            
            for(let y = currentYear; y >= minYear; y--) {
                const opt = document.createElement("option");
                opt.value = y;
                opt.text = `Sezon ${y}/${y+1}`;
                select.appendChild(opt);
            }
        }

        async function loadPlayer() {
            // Pobieramy wybrany rok z listy
            const season = document.getElementById("seasonSelect").value;
            const statsContainer = document.getElementById("statsContainer");
            
            // Pokazujemy mały loader w sekcji statystyk przy zmianie sezonu
            statsContainer.innerHTML = '<div class="text-center py-10 text-gray-400">Ładowanie danych...</div>';

            try {
                const res = await fetch(`/api/player-data/${playerId}?season=${season}`);
                const data = await res.json();

                if(!data.player && !data.statistics) {
                    statsContainer.innerHTML = '<div class="text-center py-4 text-red-500">Błąd pobierania danych.</div>';
                    return;
                }

                // Jeśli mamy info o graczu (nawet z innego sezonu), aktualizujemy nagłówek
                if (data.player) {
                    const p = data.player;
                    document.getElementById("pName").textContent = p.name;
                    document.getElementById("pPhoto").src = p.photo;
                    document.getElementById("pAge").textContent = p.age || "-";
                    document.getElementById("pNation").textContent = p.nationality || "-";
                    document.getElementById("pHeight").textContent = p.height || "-";
                }

                // Renderowanie Statystyk
                if(data.statistics && data.statistics.length > 0) {
                    // Uaktualnij klub i pozycję na podstawie pierwszego wpisu z danego sezonu
                    const mainStat = data.statistics[0];
                    document.getElementById("pTeam").textContent = mainStat.team.name;
                    document.getElementById("pPos").textContent = translatePos(mainStat.games.position);
                    
                    if(mainStat.games.number) {
                        const numBadge = document.getElementById("pNumber");
                        numBadge.textContent = "#" + mainStat.games.number;
                        numBadge.classList.remove("hidden");
                    }
                    
                    renderStats(data.statistics);
                } else {
                    statsContainer.innerHTML = `<div class="text-gray-400 p-6 bg-white rounded-xl text-center border border-gray-200 italic">Brak danych statystycznych dla sezonu ${season}/${parseInt(season)+1}.</div>`;
                    // Czyścimy klub jeśli brak danych
                    document.getElementById("pTeam").textContent = "Brak danych"; 
                }

                // Transfery (renderujemy tylko raz przy pierwszym ładowaniu, ale tutaj dla uproszczenia zawsze)
                renderTransfers(data.transfers);

                document.getElementById("loading").classList.add("hidden");
                document.getElementById("content").classList.remove("hidden");

            } catch(e) { console.error(e); }
        }

        function renderStats(statsList) {
            const container = document.getElementById("statsContainer");
            container.innerHTML = statsList.map(s => `
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-200 transition hover:shadow-md">
                    <div class="flex items-center mb-4 border-b border-gray-100 pb-3">
                        <img src="${s.league.logo}" class="w-8 h-8 object-contain mr-3">
                        <div>
                            <div class="font-bold text-gray-900 text-sm">${s.league.name}</div>
                            <div class="text-xs text-gray-400">${s.team.name}</div>
                        </div>
                        <div class="ml-auto bg-green-100 text-green-700 text-xs font-bold px-2 py-1 rounded">
                            Ocena: ${s.games.rating ? parseFloat(s.games.rating).toFixed(1) : '-'}
                        </div>
                    </div>
                    <div class="grid grid-cols-4 gap-4 text-center divide-x divide-gray-100">
                        <div>
                            <div class="text-2xl font-black text-gray-900">${s.games.appearences || 0}</div>
                            <div class="text-xs text-gray-400 uppercase font-bold mt-1">Mecze</div>
                        </div>
                        <div>
                            <div class="text-2xl font-black text-blue-600">${s.goals.total || 0}</div>
                            <div class="text-xs text-gray-400 uppercase font-bold mt-1">Gole</div>
                        </div>
                        <div>
                            <div class="text-2xl font-black text-blue-400">${s.goals.assists || 0}</div>
                            <div class="text-xs text-gray-400 uppercase font-bold mt-1">Asysty</div>
                        </div>
                        <div>
                            <div class="text-2xl font-black text-gray-600">${s.games.minutes || 0}'</div>
                            <div class="text-xs text-gray-400 uppercase font-bold mt-1">Minuty</div>
                        </div>
                    </div>
                </div>
            `).join("");
        }

        function renderTransfers(list) {
            const container = document.getElementById("transfersList");
            // Jeśli lista jest pusta, nie czyść, żeby nie mrugało (chyba że to init)
            if(!list || list.length === 0) {
                if(container.innerHTML === "") container.innerHTML = '<div class="p-6 text-center text-gray-400 text-sm">Brak historii transferów.</div>'; 
                return;
            }
            container.innerHTML = list.map(t => `
                <div class="p-4 flex items-center justify-between hover:bg-gray-50 transition">
                    <div class="text-xs text-gray-400 font-mono w-20">${t.date}</div>
                    <div class="flex-1 flex items-center justify-between px-4">
                        <div class="text-right w-5/12 font-medium text-gray-600 truncate">${t.teams.out.name}</div>
                        <div class="text-gray-300 mx-2 font-bold">➞</div>
                        <div class="text-left w-5/12 font-bold text-gray-900 truncate">${t.teams.in.name}</div>
                    </div>
                    <div class="text-xs font-bold bg-gray-100 px-2 py-1 rounded text-gray-600 w-24 text-center truncate">
                        ${t.type === "Free" ? "Wolny" : t.type}
                    </div>
                </div>
            `).join("");
        }

        function translatePos(pos) {
            const map = { "Attacker": "Napastnik", "Midfielder": "Pomocnik", "Defender": "Obrońca", "Goalkeeper": "Bramkarz" };
            return map[pos] || pos;
        }

       
        initSeasons();
        loadPlayer(); // Załaduje domyślny sezon (najnowszy)
    </script>
</body>
</html>
