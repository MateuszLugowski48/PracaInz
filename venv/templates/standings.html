<!DOCTYPE html>
<html lang="pl">
<head>
    <title>Centrum Ligowe</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Podstawowe animacje i ukrywanie scrollbara dla estetyki */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Style dla drzewka pucharowego - obsługa linii łączących i układu gałęzi */
        .node-wrapper { display: flex; align-items: center; }
        .branch-container { display: flex; flex-direction: column; justify-content: center; margin-right: 2rem; position: relative; }
        .connector-horizontal { width: 2rem; height: 2px; background-color: #cbd5e1; }
        .bracket-brace { position: absolute; right: 0; width: 2px; background-color: #cbd5e1; top: 25%; bottom: 25%; }
        
        /* Ukrywanie linii dla pojedynczych gałęzi (np. finał) */
        .branch-container.single-child .bracket-brace { display: none; }
        .branch-container.single-child::after { content: ''; position: absolute; right: 0; top: 50%; width: 10px; height: 2px; background: #cbd5e1; }

        /* Karty meczowe w drabince */
        .match-card {
            width: 15rem;
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.75rem;
            padding: 0.75rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 10;
            transition: transform 0.2s, border-color 0.2s;
        }
        .match-card:hover { transform: scale(1.02); border-color: #3b82f6; z-index: 20; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        .final-card { border-color: #facc15; background-color: #fefce8; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">

    {% include 'navbar.html' %}

    <div class="max-w-[98%] mx-auto px-2 sm:px-6 py-8">
        
        <div class="mb-8 max-w-6xl mx-auto">
            <h1 id="pageTitle" class="text-3xl font-extrabold text-gray-900">Wybierz rozgrywki</h1>
        </div>

        <div class="max-w-6xl mx-auto bg-white p-5 rounded-2xl shadow-sm border border-gray-200 mb-8 grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
            <div class="md:col-span-2 relative">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Wyszukaj Ligę</label>
                <div class="relative">
                    <input type="text" id="leagueSearchInput" onkeyup="handleLeagueSearch()" placeholder="Np. Liga Mistrzów, Ekstraklasa..." 
                           class="block w-full rounded-lg border-gray-300 py-2.5 pl-4 pr-10 text-sm focus:ring-blue-500 focus:border-blue-500 bg-white shadow-sm">
                </div>
                <div id="leagueSearchResults" class="absolute w-full bg-white border border-gray-100 shadow-xl rounded-lg mt-1 max-h-60 overflow-y-auto z-50 hidden no-scrollbar"></div>
            </div>

            <div class="md:col-span-1">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Sezon</label>
                <select id="seasonSelect" onchange="loadData()" class="block w-full rounded-lg border-gray-300 bg-gray-50 py-2.5 px-3 text-sm"></select>
            </div>

            <div class="md:col-span-1">
                <label class="block text-xs font-bold text-gray-500 uppercase mb-1">Szukaj drużyny</label>
                <input type="text" id="teamFilter" onkeyup="filterTableRows()" placeholder="Filtruj widok..." 
                       class="block w-full rounded-lg border-gray-300 py-2.5 px-3 text-sm bg-gray-50">
            </div>
        </div>

        <input type="hidden" id="selectedLeagueId">
        <input type="hidden" id="selectedLeagueName">

        <div class="max-w-6xl mx-auto border-b border-gray-200 mb-6">
            <nav class="-mb-px flex space-x-8">
                <button onclick="switchTab('standings')" id="tab-standings" class="border-blue-500 text-blue-600 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
                    📊 Tabela / Grupy
                </button>
                <button onclick="switchTab('results')" id="tab-results" class="border-transparent text-gray-500 hover:text-gray-700 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
                    📅 Wyniki (Lista)
                </button>
                <button onclick="switchTab('bracket')" id="tab-bracket" class="border-transparent text-gray-500 hover:text-gray-700 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
                    🏆 Drabinka Pucharowa
                </button>
                <button onclick="switchTab('scorers')" id="tab-scorers" class="border-transparent text-gray-500 hover:text-gray-700 whitespace-nowrap py-4 px-1 border-b-2 font-medium text-sm transition-colors">
                    ⚽ Królowie Strzelców
                </button>
            </nav>
        </div>

        <div id="view-standings" class="fade-in max-w-6xl mx-auto">
            <div id="tablesContainer" class="space-y-8"><div class="text-center py-12 text-gray-400 italic">Wyszukaj ligę powyżej.</div></div>
            <div id="legend" class="mt-6 flex flex-wrap gap-3 text-xs text-gray-600 px-2"></div>
        </div>

        <div id="view-results" class="hidden fade-in max-w-5xl mx-auto">
            <div id="resultsContainer" class="space-y-4"></div>
        </div>

        <div id="view-bracket" class="hidden fade-in">
            <div id="bracketWrapper" class="w-full overflow-x-auto pb-6 flex justify-center">
                <div id="bracketContainer" class="p-10 flex items-center"></div>
            </div>
            <div id="bracketMessage" class="hidden text-center text-gray-400 py-12">Brak fazy pucharowej dla tych rozgrywek.</div>
        </div>

        <div id="view-scorers" class="hidden fade-in max-w-4xl mx-auto">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                <div id="scorersContainer" class="divide-y divide-gray-100">
                    <div class="p-6 text-center text-gray-400 italic">
                        Wybierz ligę, aby zobaczyć listę królów strzelców.
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Konfiguracja globalna ---
        const currentYear = new Date().getFullYear();
        const minYear = 2020; 
        let searchTimeout = null;

        // Mapowanie nazw rund API na polskie odpowiedniki
        const translations = {
            "Final": "Finał", "Semi-finals": "Półfinał", "Quarter-finals": "Ćwierćfinał",
            "Round of 16": "1/8 Finału", "Round of 32": "1/16 Finału", "Round of 64": "1/32 Finału",
            "Preliminary Round": "Runda Wstępna", "Regular Season": "Sezon Zasadniczy", "Group Stage": "Faza Grupowa",
            "Knockout Round Play-offs": "Baraże o 1/8", "Round of 16 Play-offs": "Baraże o 1/8"
        };

        // Relacje między rundami - potrzebne do rekurencyjnego budowania drzewka
        const prevRoundMap = {
            "Final": "Semi-finals", "Semi-finals": "Quarter-finals", "Quarter-finals": "Round of 16",
            "Round of 16": "Round of 32", "Round of 32": "Round of 64"
        };
        
        const roundPriority = ["Final", "Semi-finals", "Quarter-finals", "Round of 16", "Round of 32"];

        // Normalizacja nazw rund (API potrafi zwracać dziwne formaty)
        function normalizeRoundName(roundName) {
            if(!roundName) return "";
            const r = roundName.toLowerCase();
            if (r.includes("qualifying") || r.includes("preliminary")) return roundName; 
            if (r.includes("final") && !r.includes("1/") && !r.includes("semi") && !r.includes("quarter") && !r.includes("8") && !r.includes("16") && !r.includes("32") && !r.includes("64")) return "Final";
            if (r.includes("semi")) return "Semi-finals";
            if (r.includes("quarter")) return "Quarter-finals";
            if (r.includes("1/32") || r.includes("64")) return "Round of 64";
            if (r.includes("1/16") || r.includes("round of 32") || r.includes("32nd") || r.includes("knockout round play-offs") || r.includes("1/16 finals")) return "Round of 32";
            if (r.includes("1/8") || r.includes("round of 16") || r.includes("8th")) return "Round of 16";
            return roundName; 
        }

        function translate(text) {
            const normalized = normalizeRoundName(text);
            return translations[normalized] || text;
        }

        function init() {
            const s = document.getElementById("seasonSelect");
            const maxYear = 2025; 
            const minYearLocal = 2020;
            for (let y = maxYear; y >= minYearLocal; y--) { 
                s.add(new Option(`${y}/${y+1}`, y)); 
            }
            s.value = 2025;
            switchTab('standings');
        }

        // --- Logika kolorowania tabel (CSS Classes) ---
        // Zależnie od ligi (LM, LE, Krajowa) wiersze mają inne kolory (awans/spadek)
        function getStyleForCL(rank, desc, total) {
            desc = desc ? desc.toLowerCase() : "";
            if (desc.includes("league phase") || total > 10) {
                if (rank <= 8) return "border-l-4 border-blue-800 bg-blue-100"; 
                if (rank <= 24) return "border-l-4 border-blue-400 bg-blue-50";
                return "border-transparent";
            }
            if (rank <= 2) return "border-l-4 border-blue-600 bg-blue-50"; 
            if (rank === 3) return "border-l-4 border-orange-400 bg-orange-50";
            return "border-transparent";
        }

        function getStyleForEL(rank, desc, total) {
            desc = desc ? desc.toLowerCase() : "";
            if (desc.includes("league phase") || total > 10) {
                if (rank <= 8) return "border-l-4 border-orange-700 bg-orange-100"; 
                if (rank <= 24) return "border-l-4 border-orange-400 bg-orange-50";
                return "border-transparent";
            }
            if (rank <= 2) return "border-l-4 border-orange-500 bg-orange-50"; 
            if (rank === 3) return "border-l-4 border-green-400 bg-green-50";
            return "border-transparent";
        }

        function getStyleForUECL(rank, desc, total) {
            desc = desc ? desc.toLowerCase() : "";
            if (desc.includes("league phase") || total > 10) {
                if (rank <= 8) return "border-l-4 border-green-700 bg-green-100"; 
                if (rank <= 24) return "border-l-4 border-green-400 bg-green-50";
                return "border-transparent";
            }
            if (rank <= 1) return "border-l-4 border-green-600 bg-green-100";
            if (rank === 2) return "border-l-4 border-green-400 bg-green-50";
            return "border-transparent";
        }

        function getStyleForDomestic(rank, desc, total) {
            desc = desc ? desc.toLowerCase() : "";
            if (desc.includes("champions league")) return "border-l-4 border-blue-600 bg-blue-50";
            if (desc.includes("europa league")) return "border-l-4 border-orange-500 bg-orange-50";
            if (desc.includes("conference")) return "border-l-4 border-green-500 bg-green-50";
            if (desc.includes("relegation")) return "border-l-4 border-red-500 bg-red-50";
            if (desc.includes("promotion")) return "border-l-4 border-blue-400 bg-blue-50";
            if (rank <= 4) return "border-l-4 border-blue-600 bg-blue-50"; 
            if (rank === 5) return "border-l-4 border-orange-500 bg-orange-50";
            if (rank > total - 3) return "border-l-4 border-red-500 bg-red-50";
            return "border-transparent";
        }

        // --- Obsługa API: Wyszukiwanie ---
        function handleLeagueSearch() {
            clearTimeout(searchTimeout);
            const q = document.getElementById("leagueSearchInput").value;
            const r = document.getElementById("leagueSearchResults");
            
            if (q.length < 3) { r.classList.add('hidden'); return; }
            
            searchTimeout = setTimeout(async () => {
                try {
                    const res = await fetch(`/search-leagues?q=${encodeURIComponent(q)}`);
                    const data = await res.json();
                    r.innerHTML = '';
                    if(data.length > 0){
                        r.classList.remove('hidden');
                        data.forEach(l=>{
                            const d=document.createElement('div');
                            d.className="flex items-center px-4 py-3 hover:bg-blue-50 cursor-pointer border-b border-gray-50";
                            d.innerHTML=`<img src="${l.logo}" class="w-6 h-6 mr-3 object-contain"><div class="text-sm font-bold">${l.name}<br><span class="text-xs text-gray-500 font-normal">${l.country}</span></div>`;
                            d.onclick=()=>{
                                document.getElementById("selectedLeagueId").value=l.id;
                                document.getElementById("selectedLeagueName").value=l.name;
                                document.getElementById("leagueSearchInput").value=l.name;
                                r.classList.add('hidden');
                                loadData();
                            };
                            r.appendChild(d);
                        });
                    } else r.classList.add('hidden');
                } catch(e) { r.classList.add('hidden'); }
            }, 300);
        }

        // Główna funkcja ładująca dane po wyborze ligi
        function loadData() {
            const lid = document.getElementById("selectedLeagueId").value;
            const seas = document.getElementById("seasonSelect").value;
            const lname = document.getElementById("selectedLeagueName").value;
            
            if(!lid) return;
            document.getElementById("pageTitle").textContent = `${lname} (${seas}/${parseInt(seas)+1})`;
            
            loadStandings(lid, seas);
            loadFixtures(lid, seas);
            loadScorers(lid, seas);
        }

        // --- Renderowanie Tabeli ---
        async function loadStandings(lid, seas) {
            const c = document.getElementById("tablesContainer"); 
            c.innerHTML = '<div class="text-center py-10">Ładowanie...</div>'; 
            document.getElementById("legend").innerHTML = "";
            
            try {
                const res = await fetch(`/standings/${lid}?season=${seas}`); 
                const groups = await res.json(); 
                c.innerHTML = "";
                
                if (!groups || groups.length === 0) { 
                    c.innerHTML = '<div class="bg-yellow-50 border-l-4 border-yellow-400 p-4 text-yellow-700">Brak tabeli (sprawdź zakładkę Drabinka).</div>'; 
                    return; 
                }
                
                const leagueName = document.getElementById("selectedLeagueName").value.toLowerCase();
                
                groups.forEach(rows => {
                    if(rows.length > 0 && rows[0].group_name) c.innerHTML += `<h3 class="font-bold mt-8 mb-3 text-xl text-gray-800">${rows[0].group_name}</h3>`;
                    
                    const tableWrapper = document.createElement("div"); 
                    tableWrapper.className = "bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden mb-6";
                    
                    let rowsHtml = rows.map(r => {
                        let styleClass = "";
                        if (leagueName.includes("champions league")) styleClass = getStyleForCL(r.rank, r.description, rows.length);
                        else if (leagueName.includes("europa league")) styleClass = getStyleForEL(r.rank, r.description, rows.length);
                        else if (leagueName.includes("conference league")) styleClass = getStyleForUECL(r.rank, r.description, rows.length);
                        else styleClass = getStyleForDomestic(r.rank, r.description, rows.length);
                        
                        return `<tr class="hover:bg-gray-50 transition group search-row" data-team="${r.team.toLowerCase()}">
                            <td class="px-4 py-4 text-center font-bold text-gray-600 ${styleClass}">${r.rank}</td>
                            <td class="px-4 py-4 flex items-center">
                                <div class="w-8 h-8 mr-4 flex-shrink-0 flex items-center justify-center bg-white p-0.5 rounded-full shadow-sm border border-gray-100"><img src="${r.logo}" class="w-full h-full object-contain"></div>
                                <span onclick="event.stopPropagation(); window.location.href='/team/${r.team_id}'" class="font-semibold text-gray-900 cursor-pointer hover:text-blue-600 hover:underline">${r.team}</span>
                            </td>
                            <td class="px-4 py-4 text-center">${r.played}</td>
                            <td class="px-4 py-4 text-center font-bold bg-gray-50">${r.points}</td>
                            <td class="px-4 py-3 text-center hidden sm:table-cell text-sm text-gray-500">${r.goalsDiff}</td>
                        </tr>`;
                    }).join("");
                    
                    tableWrapper.innerHTML = `<table class="min-w-full divide-y divide-gray-200"><thead class="bg-gray-100"><tr><th class="px-4 py-3 w-16 text-center">#</th><th class="px-4 py-3 text-left">Drużyna</th><th class="px-4 py-3 w-16 text-center">M</th><th class="px-4 py-3 w-16 text-center">Pkt</th><th class="px-4 py-3 w-16 text-center hidden sm:table-cell">+/-</th></tr></thead><tbody class="divide-y divide-gray-100">${rowsHtml}</tbody></table>`;
                    c.appendChild(tableWrapper);
                });
                
                // Generowanie legendy pod tabelą
                const legDiv = document.getElementById("legend");
                if (leagueName.includes("champions")) legDiv.innerHTML = `<div class="flex gap-4"><span class="text-xs"><span class="w-2 h-2 inline-block bg-blue-800 mr-1 rounded-full"></span>Awans (1-8)</span><span class="text-xs"><span class="w-2 h-2 inline-block bg-blue-400 mr-1 rounded-full"></span>Baraże</span></div>`;
                else if (leagueName.includes("europa")) legDiv.innerHTML = `<div class="flex gap-4"><span class="text-xs"><span class="w-2 h-2 inline-block bg-orange-700 mr-1 rounded-full"></span>Awans</span><span class="text-xs"><span class="w-2 h-2 inline-block bg-orange-400 mr-1 rounded-full"></span>Baraże</span></div>`;
                else legDiv.innerHTML = `<div class="flex gap-4"><span class="text-xs"><span class="w-2 h-2 inline-block bg-blue-600 mr-1 rounded-full"></span>LM</span><span class="text-xs"><span class="w-2 h-2 inline-block bg-orange-500 mr-1 rounded-full"></span>LE</span><span class="text-xs"><span class="w-2 h-2 inline-block bg-red-500 mr-1 rounded-full"></span>Spadek</span></div>`;
            } catch(e) { console.error(e); }
        }

        // --- Renderowanie Wyników i Drabinki ---
        async function loadFixtures(lid, seas) {
            const resCont = document.getElementById("resultsContainer");
            const brackCont = document.getElementById("bracketContainer");
            const brackMsg = document.getElementById("bracketMessage");
            try {
                const res = await fetch(`/fixtures-by-league/${lid}?season=${seas}`);
                const matches = await res.json();
                resCont.innerHTML = ""; brackCont.innerHTML = ""; brackMsg.classList.add("hidden");

                if(matches.length === 0) { resCont.innerHTML = '<div class="text-center py-8 text-gray-400">Brak meczów.</div>'; brackMsg.classList.remove("hidden"); return; }

                // Grupowanie meczów po rundach
                const groups = {};
                matches.forEach(m => {
                    const norm = normalizeRoundName(m.round);
                    if(!groups[norm]) groups[norm] = [];
                    groups[norm].push(m);
                });

                // Wyświetlanie listy wyników
                const bracketKeys = ["Final", "Semi-finals", "Quarter-finals", "Round of 16", "Round of 32", "Round of 64"];
                const listRounds = Object.keys(groups).filter(k => !bracketKeys.includes(k));
                
                if(listRounds.length === 0) resCont.innerHTML = '<div class="text-center py-8 text-gray-400 italic">Brak meczów fazy grupowej/eliminacyjnej.</div>';
                
                listRounds.sort().reverse();
                listRounds.forEach(round => {
                    let html = `<div class="bg-white rounded-xl border mb-4 overflow-hidden"><div class="bg-gray-100 px-4 py-3 font-bold text-sm text-gray-700 uppercase">${translate(round)}</div><div class="divide-y divide-gray-100">`;
                    html += groups[round].map(m => `<div onclick="window.location.href='/match/${m.id}'" class="cursor-pointer flex items-center p-4 hover:bg-blue-50 search-row transition" data-team="${m.home.toLowerCase()} ${m.away.toLowerCase()}"><div class="text-xs text-gray-400 w-24 font-mono">${m.date}</div><div class="flex-1 flex justify-between items-center"><div class="flex items-center w-5/12 justify-end"><span class="mr-3 text-sm font-medium text-right truncate">${m.home}</span><img src="${m.home_logo}" class="w-8 h-8 object-contain"></div><div class="font-bold bg-gray-100 px-3 py-1.5 rounded-lg text-sm mx-2 min-w-[60px] text-center">${m.score}</div><div class="flex items-center w-5/12"><img src="${m.away_logo}" class="w-8 h-8 object-contain ml-3 mr-3"><span class="text-sm font-medium text-left truncate">${m.away}</span></div></div></div>`).join("");
                    html += `</div></div>`;
                    resCont.innerHTML += html;
                });

                // Generowanie drzewka pucharowego
                let rootRound = null;
                for(let r of roundPriority) { if(groups[r]) { rootRound = r; break; } }

                if(!rootRound) {
                    brackMsg.classList.remove("hidden");
                } else {
                    renderRecursiveBracket(groups, rootRound, brackCont);
                }

            } catch(e) { console.error(e); }
        }

        // --- Logika Drabinki: Agregacja dwumeczów ---
        // Łączy wyniki meczu u siebie i na wyjeździe w jeden obiekt "Tie"
        function aggregateTies(matches, isFinal) {
            if(isFinal && matches.length === 1) return matches.map(m => ({ ...m, isTie: false, winner_id: (m.home_winner ? m.home_id : (m.away_winner ? m.away_id : null)), participants: [m.home_id, m.away_id] }));

            const tiesMap = {};
            matches.forEach(m => {
                const ids = [m.home_id, m.away_id].sort((a,b) => a-b);
                const key = ids.join('-');
                if(!tiesMap[key]) {
                    tiesMap[key] = {
                        team1: m.home, team1_id: m.home_id, team1_logo: m.home_logo,
                        team2: m.away, team2_id: m.away_id, team2_logo: m.away_logo,
                        matches: [], isTie: true, winner1: false, winner2: false,
                        participants: [m.home_id, m.away_id]
                    };
                }
                tiesMap[key].matches.push(m);
                if(m.home_winner) { if(m.home_id === tiesMap[key].team1_id) tiesMap[key].winner1=true; else tiesMap[key].winner2=true; }
                if(m.away_winner) { if(m.away_id === tiesMap[key].team1_id) tiesMap[key].winner1=true; else tiesMap[key].winner2=true; }
            });

            // Obliczanie sumy goli (aggregate score)
            return Object.values(tiesMap).map(tie => {
                let score1=0, score2=0, subscores=[], penaltyInfo="", winnerId=null;

                tie.matches.forEach(m => {
                    if(m.score.includes("-")) {
                        const [h, a] = m.score.split("-").map(Number);
                        if(m.home_id === tie.team1_id) { score1+=h; score2+=a; subscores.push(`${h}-${a}`); } 
                        else { score1+=a; score2+=h; subscores.push(`${a}-${h}`); }
                    }
                    if(m.penalty) penaltyInfo = m.penalty;
                });
                
                if (tie.winner1 && !tie.winner2) winnerId = tie.team1_id;
                else if (tie.winner2 && !tie.winner1) winnerId = tie.team2_id;
                else if(score1 > score2) winnerId = tie.team1_id;
                else if(score2 > score1) winnerId = tie.team2_id;
                else if(score1 === score2) {
                     const last = tie.matches.sort((a,b)=>b.timestamp-a.timestamp)[0];
                     if(last.home_winner) winnerId=last.home_id; 
                     if(last.away_winner) winnerId=last.away_id;
                }
                
                tie.aggregate = `${score1}-${score2}`; tie.subscores = subscores.join(", "); tie.penaltyInfo = penaltyInfo; tie.winner_id = winnerId;
                return tie;
            });
        }

        // --- Logika Drabinki: Rekurencja ---
        // Główna funkcja budująca drzewo DOM od finału w dół
        function renderRecursiveBracket(groups, rootRoundName, container) {
            const roundsData = {};
            ["Final", "Semi-finals", "Quarter-finals", "Round of 16", "Round of 32", "Round of 64"].forEach(r => {
                if(groups[r]) roundsData[r] = aggregateTies(groups[r], r===rootRoundName);
            });

            const rootMatches = roundsData[rootRoundName];
            
            function buildNode(match, roundName) {
                const wrapper = document.createElement("div");
                wrapper.className = "node-wrapper"; 

                const prevRound = prevRoundMap[roundName];
                const childrenContainer = document.createElement("div");
                childrenContainer.className = "branch-container"; 

                // Szukanie dzieci (meczów z poprzedniej rundy, które wyłoniły uczestników tego meczu)
                if(prevRound && roundsData[prevRound]) {
                    const p1 = match.isTie ? match.team1_id : match.home_id;
                    const p2 = match.isTie ? match.team2_id : match.away_id;

                    let source1 = roundsData[prevRound].find(m => (m.winner_id === p1));
                    let source2 = roundsData[prevRound].find(m => (m.winner_id === p2));
                    
                    // Fallback jeśli winner_id nie zadziałał (szukanie po uczestnikach)
                    if(!source1) source1 = roundsData[prevRound].find(m => m.participants.includes(p1));
                    if(!source2) source2 = roundsData[prevRound].find(m => m.participants.includes(p2) && m !== source1);

                    const sources = [source1, source2].filter(Boolean);
                    
                    if(sources.length > 0) {
                        if(sources.length > 1) {
                            const brace = document.createElement("div");
                            brace.className = "bracket-brace";
                            childrenContainer.appendChild(brace);
                        } else {
                            childrenContainer.classList.add("single-child");
                        }

                        sources.forEach(src => {
                            const childNode = buildNode(src, prevRound);
                            childNode.style.margin = "10px 0"; 
                            childrenContainer.appendChild(childNode);
                        });
                        
                        wrapper.appendChild(childrenContainer);
                        
                        const connector = document.createElement("div");
                        connector.className = "connector-horizontal";
                        wrapper.appendChild(connector);
                    }
                }

                const card = createTieCard(match, roundName);
                wrapper.appendChild(card);
                return wrapper;
            }

            container.innerHTML = "";
            const rootCol = document.createElement("div");
            rootCol.className = "flex flex-col space-y-12";
            
            rootMatches.forEach(m => {
                rootCol.appendChild(buildNode(m, rootRoundName));
            });
            container.appendChild(rootCol);
        }

        // Tworzenie elementu HTML pojedynczego węzła (karty meczu)
        function createTieCard(tie, round) {
            const card = document.createElement("div");
            const isFinal = round === "Final";
            
            let t1, t1_logo, t1_id, t2, t2_logo, t2_id, mainScore, subText, winnerId = tie.winner_id;

            if(tie.isTie) {
                t1=tie.team1; t1_logo=tie.team1_logo; t1_id=tie.team1_id; t2=tie.team2; t2_logo=tie.team2_logo; t2_id=tie.team2_id;
                mainScore=tie.aggregate; subText = `(${tie.subscores})`;
                if(tie.penaltyInfo) subText += ` <span class="text-red-500 font-bold">k. ${tie.penaltyInfo}</span>`;
            } else {
                t1=tie.home; t1_logo=tie.home_logo; t1_id=tie.home_id; t2=tie.away; t2_logo=tie.away_logo; t2_id=tie.away_id;
                mainScore=tie.score; subText = tie.date;
                if(tie.penalty) subText += ` <span class="text-red-500 font-bold">k. ${tie.penalty}</span>`;
                if (tie.home_winner) winnerId=t1_id; if(tie.away_winner) winnerId=t2_id;
            }

            const t1Class = winnerId === t1_id ? "font-extrabold text-black" : "font-medium text-gray-500";
            const t2Class = winnerId === t2_id ? "font-extrabold text-black" : "font-medium text-gray-500";
            const s1Class = winnerId === t1_id ? "bg-blue-100 text-blue-800" : "bg-gray-50";
            const s2Class = winnerId === t2_id ? "bg-blue-100 text-blue-800" : "bg-gray-50";

            let extraStyle = isFinal ? "border-yellow-400 bg-yellow-50 shadow-lg ring-4 ring-yellow-100 w-64 final-card" : "border-gray-200";

            card.className = `match-card ${extraStyle} flex flex-col justify-center`;
            card.setAttribute("data-team", `${t1} ${t2}`.toLowerCase());
            
            card.innerHTML = `
                <div class="text-[10px] text-gray-400 text-center mb-2 tracking-tight uppercase font-bold">${translate(round)}</div>
                <div class="flex justify-between items-center mb-1.5">
                    <div class="flex items-center overflow-hidden mr-2"><img src="${t1_logo}" class="w-5 h-5 mr-2 object-contain"><span class="truncate ${t1Class}">${t1}</span></div>
                    <span class="font-mono text-xs px-2 py-0.5 rounded font-bold ${s1Class}">${mainScore.split("-")[0]}</span>
                </div>
                <div class="flex justify-between items-center mb-2">
                    <div class="flex items-center overflow-hidden mr-2"><img src="${t2_logo}" class="w-5 h-5 mr-2 object-contain"><span class="truncate ${t2Class}">${t2}</span></div>
                    <span class="font-mono text-xs px-2 py-0.5 rounded font-bold ${s2Class}">${mainScore.split("-")[1]}</span>
                </div>
                <div class="text-[10px] text-gray-400 text-center border-t border-gray-100 pt-1.5 whitespace-nowrap overflow-hidden text-ellipsis">${subText}</div>
            `;
            return card;
        }

        // --- Strzelcy: Pobieranie i renderowanie ---
        async function loadScorers(lid, seas) {
            const c = document.getElementById("scorersContainer");
            if(!lid) {
                c.innerHTML = '<div class="p-6 text-center text-gray-400 italic">Wybierz ligę, aby zobaczyć listę królów strzelców.</div>';
                return;
            }
            c.innerHTML = '<div class="p-6 text-center text-gray-400 animate-pulse">Szukam snajperów...</div>';
            try {
                const res = await fetch(`/api/top-scorers/${lid}?season=${seas}`);
                if (!res.ok) throw new Error('network');
                const scorers = await res.json();

                if (!scorers || scorers.length === 0) {
                    c.innerHTML = '<div class="p-6 text-center text-gray-400 text-sm">Brak danych o strzelcach.</div>';
                    return;
                }

                c.innerHTML = scorers.map((p, i) => {
                    let medal = "";
                    if(i===0) medal = "🥇"; else if(i===1) medal = "🥈"; else if(i===2) medal = "🥉";
                    else medal = `<span class="text-gray-400 text-xs font-mono ml-1">${i+1}.</span>`;

                    return `
                    <div onclick="window.location.href='/player/${p.id}'" class="flex items-center p-3 hover:bg-gray-50 cursor-pointer transition group">
                        <div class="w-8 text-center flex-shrink-0 text-lg">${medal}</div>
                        <div class="relative flex-shrink-0 mr-3">
                            <img src="${p.photo}" class="w-10 h-10 rounded-full object-cover border border-gray-200 bg-white">
                            <img src="${p.team_logo}" class="w-4 h-4 absolute -bottom-1 -right-1 bg-white rounded-full p-0.5 border shadow-sm">
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="text-sm font-bold text-gray-900 truncate group-hover:text-blue-600 transition">${p.name}</div>
                            <div class="text-xs text-gray-500 truncate">${p.team}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-lg font-black text-blue-600 leading-none">${p.goals}</div>
                            <div class="text-[10px] text-gray-400 uppercase">Goli</div>
                        </div>
                    </div>`;
                }).join("");

            } catch(e) {
                console.error(e);
                c.innerHTML = '<div class="p-4 text-red-500 text-center text-xs">Błąd ładowania danych o strzelcach.</div>';
            }
        }

        // --- Filtrowanie widoku (Client-side) ---
        function filterTableRows() {
            const input = document.getElementById("teamFilter").value.toLowerCase();
            const visibleContainer = document.querySelector("#view-standings:not(.hidden)") ? document.getElementById("tablesContainer") : (document.querySelector("#view-results:not(.hidden)") ? document.getElementById("resultsContainer") : (document.querySelector("#view-bracket:not(.hidden)") ? document.getElementById("bracketContainer") : (document.querySelector("#view-scorers:not(.hidden)") ? document.getElementById("scorersContainer") : null)));
            
            if(!visibleContainer) return;
            
            visibleContainer.querySelectorAll(".search-row, .match-card, .flex.items-center").forEach(row => {
                const t = row.getAttribute ? row.getAttribute("data-team") : null;
                if(!t) return;
                
                // Zmieniamy opacity zamiast display:none, żeby nie psuć układu grid/flex w drabince
                row.style.opacity = (t && t.includes(input)) ? "1" : "0.1";
                if(document.querySelector("#view-standings:not(.hidden)")) row.style.display = (t && t.includes(input)) ? "" : "none";
            });
        }

        // --- Obsługa zakładek (Tabs) ---
        function switchTab(tab) {
            ['standings', 'results', 'bracket', 'scorers'].forEach(t => {
                document.getElementById(`view-${t}`).classList.add('hidden');
                const btn = document.getElementById(`tab-${t}`);
                if(btn) {
                    btn.classList.remove("border-blue-500", "text-blue-600");
                    btn.classList.add("border-transparent", "text-gray-500");
                }
            });
            document.getElementById(`view-${tab}`).classList.remove('hidden');
            const activeBtn = document.getElementById(`tab-${tab}`);
            if(activeBtn) {
                activeBtn.classList.add("border-blue-500", "text-blue-600");
                activeBtn.classList.remove("border-transparent", "text-gray-500");
            }

            if(tab === 'scorers') {
                const lid = document.getElementById("selectedLeagueId").value;
                const seas = document.getElementById("seasonSelect").value;
                if(lid) loadScorers(lid, seas);
            }
        }

        init();
    </script>
</body>
